# Car damage instance segmentation - Mask R-CNN R-101-DC5.
#
# This is the configuration the released checkpoint was trained with. In the
# original production code the settings below were split across a YAML file and
# a Python module; they are consolidated here so that one file fully describes
# both training and inference.
_BASE_: "Base-RCNN-DilatedC5.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  MASK_ON: True
  RESNETS:
    DEPTH: 101
  ROI_HEADS:
    # 7 damage classes; background is added by Detectron2 and is not counted here.
    NUM_CLASSES: 7
    # Inference default. Lower it to trade precision for recall - some true
    # damages only appear around 0.5 (see docs/LIMITATIONS.md).
    SCORE_THRESH_TEST: 0.7
    BATCH_SIZE_PER_IMAGE: 128
  RETINANET:
    NUM_CLASSES: 7
DATASETS:
  TRAIN: ("car_damage_train",)
  TEST: ("car_damage_val",)
DATALOADER:
  NUM_WORKERS: 4
SOLVER:
  STEPS: (210000, 250000)
  MAX_ITER: 270000
